name: Essai de voix (extraits à écouter, rien n'est publié)

# Ajouté le 26/10/2026 avec l'accord de l'utilisateur (« Oui, ajoute-le et fais-moi écouter les extraits ») :
# génère des extraits de voix Chatterbox Multilingual (gratuit, licence MIT) d'après essais_voix/demande.json
# et les enregistre dans essais_voix/ pour choisir la voix des vidéos YouTube à l'oreille.
on:
  push:
    branches: [main]
    paths: ["essais_voix/demande.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: essai-voix
  cancel-in-progress: false

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts soundfile scipy
      - name: Générer les extraits
        run: python youtube/essai_voix.py
      - name: Enregistrer les extraits dans le dépôt
        run: |
          git config user.name "robot-youtube"
          git config user.email "robot-youtube@users.noreply.github.com"
          git add essais_voix/*.mp3
          git diff --cached --quiet && exit 0
          git commit -q -m "Essai de voix : extraits à écouter"
          for n in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((5 * n))
          done
          exit 1
