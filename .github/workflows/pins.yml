              w = d.textlength(MARQUE, font=f_m)
              d.text(((L - w) / 2, H - 62), MARQUE, font=f_m, fill=tuple(int(c * 0.6 + 255 * 0.4) for c in encre))
              zones.update(taille_titre=t_titre, taille_texte=t_pt, lignes_titre=len(l_titre),
                           largeur_titre=max(d.textlength(x, font=f_titre, features=LNUM) for x in l_titre),
                           largeur_points=max(d.textlength(x, font=f_pt) for lp, _ in cartes for x in lp))
              img.save(chemin_sortie, "JPEG", quality=90, optimize=True, progressive=True)
              return zones


