          pin_id = (donnee.get("data") or {}).get("id")
          if r.status_code >= 300 or donnee.get("successful") is False or not pin_id:
              sys.exit("Pinterest n'a pas confirmé la création du pin : " + str(donnee.get("error"))[:500])
          print("Pin publié :", pin["titre"], "| pin_id :", pin_id)

          # Le pin est en ligne : l'inscription à l'historique ne doit jamais être perdue.
          entree = {"date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes"),
                    "titre": pin["titre"], "image": chemin, "fond": fond_etiquette, "theme": theme,
                    "design": design, "pin_id": pin_id, "md5": anti_doublons.empreinte(chemin),
                    "lien": ("article:" + article) if article else ("guide:" + guide) if guide else ""}
          limite = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=30)
          for n in range(6):
              git("fetch", "origin", "main")
              git("reset", "--hard", "origin/main")
              hist = json.load(open(HIST, encoding="utf-8"))
              if pin["titre"] not in {h["titre"] for h in hist}:
                  hist.append(entree)
              json.dump(hist, open(HIST, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
              for dossier in ("images", "videos"):
                  if not os.path.isdir(dossier):
                      continue
                  for ancien in os.listdir(dossier):
                      try:
                          date_fichier = datetime.datetime.strptime(ancien[4:12], "%Y%m%d").replace(tzinfo=datetime.timezone.utc)
                      except ValueError:
                          continue
                      if date_fichier < limite:
                          os.remove(os.path.join(dossier, ancien))
              git("add", "-A", "images", HIST)
              if os.path.isdir("videos"):
                  git("add", "-A", "videos")
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  break
              git("commit", "-m", "Nouveau pin : " + pin["titre"][:60])
              try:
                  git("push", "origin", "HEAD:main")
                  break
              except subprocess.CalledProcessError as e:
                  print(f"Push historique refusé (essai {n + 1}/6) :", (e.stderr or "")[:300])
                  time.sleep(5 + 5 * n)
          else:
              sys.exit(f"PIN PUBLIÉ ({pin_id}) MAIS HISTORIQUE NON ENREGISTRÉ : ajouter « {pin['titre']} » dans {HIST}")
          EOF
