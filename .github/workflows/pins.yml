name: Pins Pinterest

on:
  schedule:
    - cron: "0 6,8,10,12,14,17,20 * * *"
  workflow_dispatch:
    inputs:
      test_seulement:
        description: "Test uniquement (génère une image, ne publie rien sur Pinterest)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow requests

      - name: Créer et envoyer un pin
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          LIEN_PAGE: ${{ secrets.LIEN_PAGE }}
          TEST: ${{ github.event.inputs.test_seulement == 'true' && '1' || '' }}
        run: |
          git config user.name "robot-pins"
          git config user.email "robot-pins@users.noreply.github.com"
          python - <<'EOF'
