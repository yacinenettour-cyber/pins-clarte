name: Pins Pinterest

on:
  schedule:
    - cron: "0 6,9,12,15,18 * * *"
  workflow_dispatch:
    inputs:
      test_seulement:
        description: "Test uniquement (génère une image, ne publie rien sur Pinterest)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow requests

      - name: Créer et envoyer un pin
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          LIEN_PAGE: ${{ secrets.LIEN_PAGE }}
          TEST: ${{ github.event.inputs.test_seulement == 'true' && '1' || '' }}
        run: |
          git config user.name "robot-pins"
          git config user.email "robot-pins@users.noreply.github.com"
          python - <<'EOF'
          import os, json, random, time, datetime, subprocess, sys, glob
          import requests
          from PIL import Image, ImageDraw, ImageFont

          MARQUE = "Clarté Mentale | Stress & Énergie"
          TEST = os.environ.get("TEST") == "1"

          # Banque de pins écrits à l'avance (gratuit, pas d'appel API).
          # Thème : le sommeil perturbé par le stress.
          BANQUE = [
              {"titre": "Le geste du soir que presque personne ne fait (et qui change tout)",
               "texte_image": "Le geste du soir que personne ne fait",
               "description": "Il existe un geste tout simple à faire le soir, que très peu de personnes connaissent, et qui peut vraiment changer la qualité de l'endormissement quand le mental est encore agité. Il ne prend que quelques minutes, ne demande aucun matériel, et fonctionne même les soirs les plus stressants. Il est expliqué en détail, étape par étape, dans le guide gratuit : clique sur cette épingle pour le récupérer et l'essayer dès ce soir. #sommeil #stress #routinedusoir #bienetre #anxiete"},
              {"titre": "3 gestes du soir qui calment le mental (peu de gens les connaissent)",
               "texte_image": "3 gestes du soir méconnus",
               "description": "Le soir, le cerveau a souvent du mal à ralentir après une journée stressante. Il existe 3 gestes simples, peu connus, qui aident à faire cette transition en douceur. Ils sont détaillés pas à pas dans le guide gratuit, avec des explications concrètes pour les mettre en place dès ce soir. Clique sur l'épingle pour le recevoir. #sommeil #stress #routinedusoir #calme #bienetre"},
              {"titre": "Ce petit rituel du soir aide à lâcher les pensées qui tournent",
               "texte_image": "Le petit rituel du soir efficace",
               "description": "Ruminer au moment de dormir, presque tout le monde connaît. Il existe un petit rituel simple, expliqué en détail dans le guide gratuit, qui aide à relâcher les pensées qui tournent en boucle avant de fermer les yeux. Clique sur cette épingle pour découvrir comment le mettre en place ce soir. #sommeil #stress #routinedusoir #ruminations #detente"},

              {"titre": "L'erreur n°1 qui empêche de s'endormir (presque tout le monde la fait)",
               "texte_image": "L'erreur n°1 qui empêche de dormir",
               "description": "Une erreur très répandue empêche de s'endormir sans qu'on s'en rende compte, et elle a souvent l'effet inverse de ce qu'on recherche. Le guide gratuit explique exactement quelle est cette erreur et par quoi la remplacer, étape par étape. Clique sur l'épingle pour le récupérer et arrêter de la reproduire dès ce soir. #sommeil #stress #insomnie #ruminations #bienetre"},
              {"titre": "Pourquoi rester au lit à lutter empire tout (et que faire à la place)",
               "texte_image": "Ce qu'il faut faire à la place",
               "description": "Rester allongé à \"forcer\" le sommeil est un réflexe très courant, mais il aggrave souvent les nuits difficiles. Il existe une alternative simple et concrète, expliquée en détail dans le guide gratuit, pour casser ce cercle sans lutter contre soi-même. Clique sur cette épingle pour la découvrir. #sommeil #stress #insomnie #nuitsdifficiles #calme"},
              {"titre": "L'erreur du soir qui garde ton cerveau en alerte sans que tu le saches",
               "texte_image": "Cette erreur garde ton cerveau éveillé",
               "description": "Un geste anodin, fait presque tous les soirs, peut suffire à maintenir le cerveau en alerte au pire moment. Le guide gratuit détaille cette erreur et la routine à mettre en place pour l'éviter. Clique sur l'épingle pour y accéder. #sommeil #stress #reveilnocturne #ecrans #bienetre"},

              {"titre": "Cette question simple aide à calmer les pensées qui tournent la nuit",
               "texte_image": "Une question qui calme le mental la nuit",
               "description": "Il existe une question toute simple à se poser quand les pensées tournent en boucle la nuit, qui aide à prendre du recul sans nier ce qui préoccupe. Elle est expliquée avec la méthode complète dans le guide gratuit. Clique sur cette épingle pour la découvrir et l'essayer cette nuit. #sommeil #stress #ruminations #nuitblanche #anxiete"},
              {"titre": "Et si cette pensée qui tourne pouvait attendre demain matin ?",
               "texte_image": "Cette pensée peut-elle attendre demain ?",
               "description": "La nuit, une pensée qui semble urgente paraît souvent bien plus légère une fois le jour levé. Le guide gratuit propose une méthode simple pour appliquer ce principe concrètement, au moment où le mental s'emballe. Clique sur l'épingle pour la recevoir. #sommeil #stress #ruminations #mentalclair #nuitagitee"},
              {"titre": "La question à te poser quand tu ressasses la même chose chaque nuit",
               "texte_image": "La question à te poser chaque nuit",
               "description": "Certaines pensées reviennent nuit après nuit, comme si elles étaient urgentes et définitives. Une question simple peut aider à leur redonner leur juste taille : elle est expliquée avec plus de détails dans le guide gratuit. Clique sur cette épingle pour le récupérer. #sommeil #stress #ruminations #relativiser #calmemental"},

              {"titre": "La mini-routine du coucher en 4 étapes (peu de gens la connaissent)",
               "texte_image": "La mini-routine du coucher méconnue",
               "description": "Il existe une mini-routine du coucher, simple et rapide, qui aide le corps à reconnaître le signal du repos même après une journée stressante. Les 4 étapes complètes sont détaillées dans le guide gratuit. Clique sur cette épingle pour les découvrir et les essayer dès ce soir. #sommeil #stress #routinedusoir #bienetre #calme"},
              {"titre": "Cette routine du soir en 4 étapes calme le mental avant de dormir",
               "texte_image": "4 étapes pour calmer le mental le soir",
               "description": "Une routine du soir courte peut suffire à préparer un sommeil plus calme, à condition de suivre les bonnes étapes dans le bon ordre. Le guide gratuit détaille cette routine en 4 étapes simples à mettre en place ce soir. Clique sur l'épingle pour la recevoir. #sommeil #stress #routinedusoir #detente #bienetre"},
              {"titre": "La routine du coucher qui aide quand le mental tourne encore à fond",
               "texte_image": "La routine quand le mental tourne encore",
               "description": "Quand le mental tourne encore à plein régime au moment de se coucher, une petite routine bien construite peut aider à ralentir. Elle est expliquée pas à pas dans le guide gratuit. Clique sur cette épingle pour y accéder. #sommeil #stress #routinedusoir #mentalcalme #bienetre"},

              {"titre": "Cette phrase toute simple aide à calmer le mental avant de dormir",
               "texte_image": "La phrase qui calme le mental le soir",
               "description": "Il existe une phrase très simple à se répéter quand les pensées s'emballent au coucher, qui aide à désamorcer l'urgence ressentie. Elle est expliquée avec le contexte complet dans le guide gratuit. Clique sur cette épingle pour la découvrir. #sommeil #stress #calmemental #bienetre #anxiete"},
              {"titre": "La phrase à se dire quand le mental s'emballe en pleine nuit",
               "texte_image": "La phrase à se dire en pleine nuit",
               "description": "Face à un mental qui s'agite au moment de dormir, une phrase toute simple peut aider à relâcher la pression. Le guide gratuit explique comment et quand l'utiliser pour qu'elle fonctionne vraiment. Clique sur l'épingle pour le récupérer. #sommeil #stress #anxiete #calmemental #bienetre"},
              {"titre": "Cette phrase réconfortante aide à lâcher prise avant de fermer les yeux",
               "texte_image": "Lâcher prise avant de fermer les yeux",
               "description": "Certains soirs, une phrase rassurante suffit à desserrer la tension mentale, à condition de savoir comment se l'approprier vraiment. La méthode complète est dans le guide gratuit. Clique sur cette épingle pour y accéder. #sommeil #stress #lâcherprise #calmemental #bienetre"},

              {"titre": "Cet exercice de respiration facile calme le mental en quelques minutes",
               "texte_image": "Un exercice de respiration qui calme vite",
               "description": "Un exercice de respiration simple peut aider à ralentir le rythme cardiaque et détourner l'attention des pensées qui s'agitent, sans matériel ni effort particulier. Il est expliqué pas à pas dans le guide gratuit. Clique sur cette épingle pour le recevoir et l'essayer ce soir. #sommeil #stress #respiration #calme #bienetre"},
              {"titre": "La respiration qui aide à s'endormir plus facilement (peu connue)",
               "texte_image": "La respiration qui aide à dormir",
               "description": "Un rythme de respiration particulier, plus lent que l'habituel, peut envoyer un signal d'apaisement au corps au moment du coucher. Il est détaillé étape par étape dans le guide gratuit. Clique sur l'épingle pour le découvrir. #sommeil #stress #respiration #relaxation #bienetre"},
              {"titre": "Cet exercice simple aide à calmer les pensées qui tournent au lit",
               "texte_image": "Calmer les pensées qui tournent au lit",
               "description": "Quand les pensées s'enchaînent au lit, un exercice de respiration bien précis peut aider à recentrer l'attention loin du mental agité. La méthode complète est expliquée dans le guide gratuit. Clique sur cette épingle pour y accéder. #sommeil #stress #respiration #ruminations #calme"},

              {"titre": "Ce qu'il vaut mieux éviter avant de dormir (presque personne ne le sait)",
               "texte_image": "À éviter avant de dormir (peu connu)",
               "description": "Certaines habitudes du soir, en apparence anodines, entretiennent sans le vouloir un mental agité au pire moment. Le guide gratuit liste ces habitudes et ce qu'il vaut mieux faire à la place. Clique sur cette épingle pour le récupérer. #sommeil #stress #ecrans #routinedusoir #bienetre"},
              {"titre": "3 habitudes du soir qui empêchent de bien dormir sans qu'on le sache",
               "texte_image": "3 habitudes qui empêchent de dormir",
               "description": "Sans s'en rendre compte, certaines habitudes du soir nourrissent le stress au moment de dormir. Le guide gratuit détaille ces 3 habitudes et comment les remplacer progressivement. Clique sur l'épingle pour le découvrir. #sommeil #stress #routinedusoir #ecrans #calme"},
              {"titre": "Évite ça avant de te coucher si tu as du mal à dormir",
               "texte_image": "À éviter avant de te coucher",
               "description": "Certains gestes du soir ont tendance à relancer le mental plutôt qu'à l'apaiser, souvent sans qu'on fasse le lien. Le guide gratuit explique lesquels éviter et par quoi les remplacer. Clique sur cette épingle pour y accéder. #sommeil #stress #routinedusoir #calme #bienetre"},

              {"titre": "Réveillé à 3h avec la tête pleine ? Voici ce qui aide vraiment",
               "texte_image": "Réveillé à 3h, la tête pleine ?",
               "description": "Se réveiller en pleine nuit avec des pensées qui s'enchaînent est fréquent en période de stress. Il existe une méthode simple, expliquée pas à pas dans le guide gratuit, pour calmer cette agitation mentale sans lutter. Clique sur cette épingle pour la recevoir. #sommeil #stress #reveilnocturne #ruminations #bienetre"},
              {"titre": "Réveil à 3h du matin : la piste à essayer avant de paniquer",
               "texte_image": "La piste à essayer à 3h du matin",
               "description": "Un réveil nocturne avec l'esprit qui s'emballe n'a rien d'anormal en période de stress. Une piste simple et concrète, détaillée dans le guide gratuit, peut aider à redescendre en intensité sans forcer. Clique sur l'épingle pour la découvrir. #sommeil #stress #reveilnocturne #calmemental #anxiete"},
              {"titre": "Que faire à 3h du matin quand les pensées s'enchaînent sans arrêt ?",
               "texte_image": "Les pensées s'enchaînent à 3h du matin ?",
               "description": "Face à un réveil nocturne où les pensées s'enchaînent, une méthode précise peut aider à redescendre en intensité et à retrouver un peu de calme. Elle est expliquée en détail dans le guide gratuit. Clique sur cette épingle pour y accéder. #sommeil #stress #reveilnocturne #respiration #bienetre"},
          ]

          HIST = "historique.json"
          historique = json.load(open(HIST, encoding="utf-8")) if os.path.exists(HIST) else []


          def telecharger_police(nom, url, secours):
              try:
                  r = requests.get(url, timeout=30)
                  r.raise_for_status()
                  open(nom, "wb").write(r.content)
                  return nom
              except Exception:
                  return secours if os.path.exists(secours) else None


          def charger_police(chemin, taille):
              if chemin:
                  return ImageFont.truetype(chemin, taille)
              return ImageFont.load_default(size=taille)


          def choisir_texte():
              recents = {h["titre"] for h in historique[-len(BANQUE) + 5:]}
              candidats = [p for p in BANQUE if p["titre"] not in recents]
              if not candidats:
                  candidats = BANQUE
              return dict(random.choice(candidats))


          def couper_lignes(dessin, texte, police, largeur_max):
              lignes, ligne = [], ""
              for mot in texte.split():
                  essai = (ligne + " " + mot).strip()
                  if dessin.textlength(essai, font=police) <= largeur_max:
                      ligne = essai
                  else:
                      if ligne:
                          lignes.append(ligne)
                      ligne = mot
              if ligne:
                  lignes.append(ligne)
              return lignes


          def dessiner_image(texte_image, chemin_sortie, police_grasse, police_normale):
              L, H = 1000, 1500
              fonds = sorted(glob.glob("fonds/*.png") + glob.glob("fonds/*.jpg") + glob.glob("fonds/*.jpeg"))
              if fonds:
                  img = Image.open(random.choice(fonds)).convert("RGB").resize((L, H))
                  voile = Image.new("RGBA", (L, H), (15, 20, 40, 110))
                  img = Image.alpha_composite(img.convert("RGBA"), voile).convert("RGB")
              else:
                  img = Image.new("RGB", (L, H))
                  d = ImageDraw.Draw(img)
                  haut, bas = (22, 30, 58), (58, 70, 120)
                  for y in range(H):
                      t = y / H
                      d.line([(0, y), (L, y)], fill=tuple(int(haut[i] + (bas[i] - haut[i]) * t) for i in range(3)))
                  d.ellipse([690, 120, 870, 300], fill=(236, 230, 205))
                  t = 185 / H
                  d.ellipse([740, 95, 920, 275], fill=tuple(int(haut[i] + (bas[i] - haut[i]) * t) for i in range(3)))
                  for _ in range(40):
                      x, y = random.randint(40, 960), random.randint(40, 520)
                      r = random.choice([2, 2, 3])
                      d.ellipse([x, y, x + r, y + r], fill=(220, 225, 245))

              d = ImageDraw.Draw(img)
              marge = 90
              largeur = L - 2 * marge
              taille = 110
              while taille > 50:
                  police = charger_police(police_grasse, taille)
                  lignes = couper_lignes(d, texte_image, police, largeur)
                  hauteur_ligne = int(taille * 1.25)
                  if len(lignes) <= 5 and hauteur_ligne * len(lignes) <= 700:
                      break
                  taille -= 6

              bloc = hauteur_ligne * len(lignes)
              y = 560 + (560 - bloc) // 2
              for ligne in lignes:
                  w = d.textlength(ligne, font=police)
                  d.text(((L - w) / 2, y), ligne, font=police, fill=(255, 255, 255))
                  y += hauteur_ligne

              d.line([(L / 2 - 60, y + 55), (L / 2 + 60, y + 55)], fill=(236, 230, 205), width=4)

              police_pied = charger_police(police_normale, 34)
              w = d.textlength(MARQUE, font=police_pied)
              d.text(((L - w) / 2, H - 110), MARQUE, font=police_pied, fill=(225, 228, 240))

              img.save(chemin_sortie, "PNG", optimize=True)


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout.strip()


          police_grasse = telecharger_police("Poppins-Bold.ttf",
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          police_normale = telecharger_police("Poppins-Regular.ttf",
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf")

          if TEST:
              pin = {"titre": "Test", "description": "Test",
                     "texte_image": os.environ.get("TEXTE", "Ton cerveau ne s'arrête pas la nuit ?")}
          else:
              pin = choisir_texte()

          pin["titre"] = pin["titre"][:100]
          pin["description"] = pin["description"][:800]

          os.makedirs("images", exist_ok=True)
          nom = "pin-" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d-%H%M%S") + ".png"
          chemin = os.path.join("images", nom)
          dessiner_image(pin["texte_image"], chemin, police_grasse, police_normale)
          print("Image créée :", chemin)

          if TEST:
              sys.exit(0)

          historique.append({"date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes"),
                             "titre": pin["titre"], "image": chemin})
          json.dump(historique, open(HIST, "w", encoding="utf-8"), ensure_ascii=False, indent=1)

          git("add", chemin, HIST)
          git("commit", "-m", "Nouveau pin : " + pin["titre"][:60])
          git("push")
          sha = git("rev-parse", "HEAD")
          url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{sha}/{chemin}"

          for _ in range(18):
              try:
                  if requests.get(url, timeout=15).status_code == 200:
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              sys.exit("L'image n'est pas accessible en ligne : " + url)

          envoi = {"titre": pin["titre"], "description": pin["description"],
                   "image_url": url, "lien": os.environ["LIEN_PAGE"]}
          r = requests.post(os.environ["MAKE_WEBHOOK_URL"], json=envoi, timeout=60)
          print("Réponse de Make :", r.status_code, r.text[:200])
          if r.status_code >= 300:
              sys.exit("Make a refusé l'envoi.")
          print("Pin envoyé :", pin["titre"])
          EOF

      - name: Aperçu de l'image de test
        if: ${{ github.event.inputs.test_seulement == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apercu-pin-test
          path: images/*.png
