                      except ValueError:
                          continue
                      if date_fichier < limite:
                          os.remove(os.path.join(dossier, ancien))
              git("add", "-A", "images", HIST)
              if os.path.isdir("videos"):
                  git("add", "-A", "videos")
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  break
              git("commit", "-m", "Nouveau pin : " + pin["titre"][:60])
              try:
                  git("push", "origin", "HEAD:main")
                  break
              except subprocess.CalledProcessError as e:
                  print(f"Push historique refusé (essai {n + 1}/6) :", (e.stderr or "")[:300])
                  time.sleep(5 + 5 * n)
          else:
