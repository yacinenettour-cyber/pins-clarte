                  fond_etiquette = fond

              avec_lien = theme not in THEMES_SANS_LIEN
              if design == "clair" and pin.get("points_image"):
                  dessiner_clair_infographie(pin["texte_image"], pin["points_image"], chemin, police_grasse, police_normale, fond, theme, avec_lien)
              elif design == "clair":
                  dessiner_clair_phrase(pin["texte_image"], chemin, police_grasse, police_normale, fond, theme, avec_lien)
              elif pin.get("points_image"):
                  dessiner_infographie(pin["texte_image"], pin["points_image"], chemin, police_grasse, police_normale, fond, avec_lien=avec_lien)
              else:
                  dessiner_image(pin["texte_image"], chemin, police_grasse, police_normale, fond, avec_lien)
              print("Thème détecté :", theme, "| visuel :", design)
              print("Fond utilisé :", fond_etiquette)
          print("Image créée :", chemin)

          if TEST:
              sys.exit(0)

          # pins.yml, videos.yml (et carousel.yml en manuel) poussent tous sur main.
          def pousser_avec_rebase(essais=5):
              for n in range(essais):
                  try:
                      git("pull", "--rebase", "origin", "main")
                      git("push", "origin", "HEAD:main")
                      return
                  except subprocess.CalledProcessError as e:
                      print(f"Push refusé (essai {n + 1}/{essais}) :", (e.stderr or "")[:300])
                      subprocess.run(["git", "rebase", "--abort"], capture_output=True)
                      time.sleep(5 + 5 * n)
              sys.exit("Impossible de pousser sur main après plusieurs essais.")

          git("add", chemin)
          git("commit", "-m", "Image du pin : " + pin["titre"][:60])
          pousser_avec_rebase()
          sha = git("rev-parse", "HEAD")
          if pin["titre"] in {h["titre"] for h in json.load(open(HIST, encoding="utf-8"))}:
              sys.exit("Ce pin vient d'être publié par un autre run, publication annulée : " + pin["titre"])
          url = f"https://cdn.jsdelivr.net/gh/{os.environ['GITHUB_REPOSITORY']}@{sha}/{chemin}"

          if not attendre_en_ligne(url):
