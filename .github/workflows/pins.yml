          if lien and "utm_source=" not in lien:
              lien += ("&" if "?" in lien else "?") + f"utm_source=pinterest&utm_medium=organic&utm_campaign={theme}"

          # Publication directe via l'API Composio (comme videos.yml) : permet le texte
