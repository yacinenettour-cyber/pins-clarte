              if LIEN_GUIDE_CORTISOL and (choix == "cortisol" or theme in THEMES_GUIDE_CORTISOL):
                  return "cortisol"
              return None if theme in THEMES_SANS_LIEN else "sommeil"


          def theme_avec_lien(theme):
              return theme not in THEMES_SANS_LIEN or bool(LIEN_GUIDE_CORTISOL and theme in THEMES_GUIDE_CORTISOL)


