          # pins.yml, videos.yml (et carousel.yml en manuel) poussent tous sur main.
          def pousser_avec_rebase(essais=5):
              for n in range(essais):
                  try:
                      git("pull", "--rebase", "origin", "main")
                      git("push", "origin", "HEAD:main")
                      return
                  except subprocess.CalledProcessError as e:
                      print(f"Push refusé (essai {n + 1}/{essais}) :", (e.stderr or "")[:300])
                      subprocess.run(["git", "rebase", "--abort"], capture_output=True)
                      time.sleep(5 + 5 * n)
              sys.exit("Impossible de pousser sur main après plusieurs essais.")

