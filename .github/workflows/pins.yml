          PART_ARTICLES = 1.0


          def article_du_pin(pin, guide, historique):
              slug = pin.get("article")
              if slug not in ARTICLES_SITE or not pin.get("description_article"):
                  return None
              if guide is None:
                  return slug
              debut = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=14)).isoformat(timespec="minutes")
              liens = [h["lien"] for h in historique if h.get("lien") and h.get("date", "") >= debut]
              vers_articles = sum(1 for l in liens if l.startswith("article:"))
              return slug if vers_articles < PART_ARTICLES * (len(liens) + 1) else None


          def lignes_carte_article(slug):
              return ("ARTICLE COMPLET · lien dans l'épingle", f"« {ARTICLES_SITE[slug]} »",
