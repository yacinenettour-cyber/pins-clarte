              "description": pin["description"][:800],
              "alt_text": texte_alternatif(pin, theme),
              "media_source": {"source_type": "image_url", "url": url},
          }
          if lien:
              arguments["link"] = lien
          r = requests.post(
              "https://backend.composio.dev/api/v3.1/tools/execute/PINTEREST_CREATE_PIN",
              headers={"x-api-key": CLE, "Content-Type": "application/json"},
              json={"arguments": arguments, "entity_id": entite}, timeout=60,
          )
          print("Réponse Composio :", r.status_code, r.text[:300])
          try:
              donnee = r.json()
          except Exception:
              sys.exit("Réponse Composio illisible, pin non confirmé.")
          pin_id = (donnee.get("data") or {}).get("id")
          if r.status_code >= 300 or donnee.get("successful") is False or not pin_id:
              sys.exit("Pinterest n'a pas confirmé la création du pin : " + str(donnee.get("error"))[:500])
          print("Pin publié :", pin["titre"], "| pin_id :", pin_id)

          # Le pin est en ligne : l'inscription à l'historique ne doit jamais être perdue.
          entree = {"date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes"),
                    "titre": pin["titre"], "image": chemin, "fond": fond_etiquette, "theme": theme,
                    "design": design, "pin_id": pin_id}
          limite = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=30)
          for n in range(6):
              git("fetch", "origin", "main")
              git("reset", "--hard", "origin/main")
              hist = json.load(open(HIST, encoding="utf-8"))
              if pin["titre"] not in {h["titre"] for h in hist}:
                  hist.append(entree)
              json.dump(hist, open(HIST, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
              for dossier in ("images", "videos"):
