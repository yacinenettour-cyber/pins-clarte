              # Épingles illustrées « exercices » et « clés » (15/10/2026, consignes de l'utilisateur :
              # « 1 à 2 épingles de ce type par jour », puis « tu regardes les épingles qui fonctionnent
              # le mieux et tu produis des épingles similaires sans copier ») : au plus 2 sur 24 h, tous
              # formats illustrés confondus, espacées d'au moins 8 h ; prioritaires quand ce quota le
              # permet (en alternant les formats), écartées sinon.
              maintenant = datetime.datetime.now(datetime.timezone.utc)
              exos_faits = [h["date"] for h in historique if h.get("design") in FORMATS_ILLUSTRES and h.get("date")]
              debut_24h = (maintenant - datetime.timedelta(hours=24)).isoformat(timespec="minutes")
              debut_8h = (maintenant - datetime.timedelta(hours=8)).isoformat(timespec="minutes")
              exo_permis = (sum(d >= debut_24h for d in exos_faits) < 2
                            and not any(d >= debut_8h for d in exos_faits))
              if not exo_permis:
                  restants = [p for p in restants if p.get("format") not in FORMATS_ILLUSTRES] or restants
              par_theme = {}
              for p in restants:
