                      print("Fond généré par IA (OpenAI) pour le thème :", theme)
                  except Exception as e:
                      print("Échec de la génération IA, on retombe sur la banque de fonds :", e)
              # Test A/B (29/09/2026) : alternance stricte entre le visuel clair (inspiré des
              # meilleurs Idea Pins du compte) et l'ancien visuel sombre, notée dans
              # historique.json ("design") pour comparer les statistiques après 2-3 semaines.
              n_clair = sum(1 for h in historique if h.get("design") == "clair")
              n_sombre = sum(1 for h in historique if h.get("design") == "sombre")
              design = "clair" if n_clair <= n_sombre else "sombre"
              if not fond:
