          def lien_du_pin(guide, article, theme, titre):
              if article:
                  lien = f"{SITE_WEB}/{article}/"
              else:
                  lien = {"sommeil": os.environ["LIEN_PAGE"], "cortisol": LIEN_GUIDE_CORTISOL}.get(guide, "") if guide else ""
              # Suivi par thème et par pin (systeme.io pour les guides, statistiques du site pour les articles).
              if lien and "utm_source=" not in lien:
                  # utm_content propre à chaque pin (07/10/2026) : chaque épingle pointe vers une adresse
                  # distincte au lieu de ~7 épingles par jour vers exactement la même.
                  slug = "-".join(re.findall(r"[a-z0-9]+", unicodedata.normalize("NFD", titre.lower()).encode("ascii", "ignore").decode()))[:60]
                  lien += ("&" if "?" in lien else "?") + f"utm_source=pinterest&utm_medium=organic&utm_campaign={theme}&utm_content={slug}"
              return lien


          def guide_du_pin(pin, theme):
