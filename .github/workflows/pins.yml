          HIST = "historique.json"
          historique = json.load(open(HIST, encoding="utf-8")) if os.path.exists(HIST) else []


          def telecharger_police(nom, url, secours):
              try:
                  r = requests.get(url, timeout=30)
                  r.raise_for_status()
                  open(nom, "wb").write(r.content)
                  return nom
              except Exception:
                  return secours if os.path.exists(secours) else None


          def charger_police(chemin, taille):
              if chemin:
                  return ImageFont.truetype(chemin, taille)
              return ImageFont.load_default(size=taille)


          def choisir_texte():
              recents = {h["titre"] for h in historique[-len(BANQUE) + 5:]}
              candidats = [p for p in BANQUE if p["titre"] not in recents]
              if not candidats:
                  candidats = BANQUE
              return dict(random.choice(candidats))


          def choisir_fond():
              fonds = sorted(glob.glob("fonds/*.png") + glob.glob("fonds/*.jpg") + glob.glob("fonds/*.jpeg"))
              if not fonds:
                  return None
              recents = {h.get("fond") for h in historique[-3:]}
              candidats = [f for f in fonds if f not in recents]
              if not candidats:
                  candidats = fonds
              return random.choice(candidats)


          def couper_lignes(dessin, texte, police, largeur_max):
              lignes, ligne = [], ""
              for mot in texte.split():
                  essai = (ligne + " " + mot).strip()
                  if dessin.textlength(essai, font=police) <= largeur_max:
                      ligne = essai
                  else:
                      if ligne:
                          lignes.append(ligne)
                      ligne = mot
              if ligne:
                  lignes.append(ligne)
              return lignes


          def dessiner_image(texte_image, chemin_sortie, police_grasse, police_normale, fond):
              L, H = 1000, 1500
              if fond:
                  img = Image.open(fond).convert("RGB").resize((L, H))
                  voile = Image.new("RGBA", (L, H), (15, 20, 40, 110))
                  img = Image.alpha_composite(img.convert("RGBA"), voile).convert("RGB")
              else:
                  img = Image.new("RGB", (L, H))
                  d = ImageDraw.Draw(img)
                  haut, bas = (22, 30, 58), (58, 70, 120)
                  for y in range(H):
                      t = y / H
                      d.line([(0, y), (L, y)], fill=tuple(int(haut[i] + (bas[i] - haut[i]) * t) for i in range(3)))
                  d.ellipse([690, 120, 870, 300], fill=(236, 230, 205))
                  t = 185 / H
                  d.ellipse([740, 95, 920, 275], fill=tuple(int(haut[i] + (bas[i] - haut[i]) * t) for i in range(3)))
                  for _ in range(40):
                      x, y = random.randint(40, 960), random.randint(40, 520)
                      r = random.choice([2, 2, 3])
                      d.ellipse([x, y, x + r, y + r], fill=(220, 225, 245))

              d = ImageDraw.Draw(img)
              marge = 90
              largeur = L - 2 * marge
              taille = 110
              while taille > 50:
                  police = charger_police(police_grasse, taille)
                  lignes = couper_lignes(d, texte_image, police, largeur)
                  hauteur_ligne = int(taille * 1.25)
                  if len(lignes) <= 5 and hauteur_ligne * len(lignes) <= 700:
                      break
                  taille -= 6

              bloc = hauteur_ligne * len(lignes)
              y = 560 + (560 - bloc) // 2
              for ligne in lignes:
                  w = d.textlength(ligne, font=police)
                  d.text(((L - w) / 2, y), ligne, font=police, fill=(255, 255, 255))
                  y += hauteur_ligne

              d.line([(L / 2 - 60, y + 55), (L / 2 + 60, y + 55)], fill=(236, 230, 205), width=4)

              police_pied = charger_police(police_normale, 34)
              w = d.textlength(MARQUE, font=police_pied)
              d.text(((L - w) / 2, H - 110), MARQUE, font=police_pied, fill=(225, 228, 240))

              img.save(chemin_sortie, "PNG", optimize=True)


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout.strip()


          police_grasse = telecharger_police("Poppins-Bold.ttf",
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          police_normale = telecharger_police("Poppins-Regular.ttf",
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf")

          if TEST:
              pin = {"titre": "Test", "description": "Test",
                     "texte_image": os.environ.get("TEXTE", "Ton cerveau ne s'arrête pas la nuit ?")}
          else:
              pin = choisir_texte()

          pin["titre"] = pin["titre"][:100]
          pin["description"] = pin["description"][:800]

          os.makedirs("images", exist_ok=True)
          nom = "pin-" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d-%H%M%S") + ".png"
          chemin = os.path.join("images", nom)
          fond = choisir_fond()
          dessiner_image(pin["texte_image"], chemin, police_grasse, police_normale, fond)
          print("Image créée :", chemin, "(fond :", fond, ")")

          if TEST:
              sys.exit(0)

          historique.append({"date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes"),
                             "titre": pin["titre"], "image": chemin, "fond": fond})
          json.dump(historique, open(HIST, "w", encoding="utf-8"), ensure_ascii=False, indent=1)

          git("add", chemin, HIST)
          git("commit", "-m", "Nouveau pin : " + pin["titre"][:60])
          git("push")
          sha = git("rev-parse", "HEAD")
          url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{sha}/{chemin}"

          for _ in range(18):
              try:
                  if requests.get(url, timeout=15).status_code == 200:
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              sys.exit("L'image n'est pas accessible en ligne : " + url)

          envoi = {"titre": pin["titre"], "description": pin["description"],
                   "image_url": url, "lien": os.environ["LIEN_PAGE"]}
          r = requests.post(os.environ["MAKE_WEBHOOK_URL"], json=envoi, timeout=60)
          print("Réponse de Make :", r.status_code, r.text[:200])
          if r.status_code >= 300:
              sys.exit("Make a refusé l'envoi.")
          print("Pin envoyé :", pin["titre"])
          EOF

      - name: Aperçu de l'image de test
        if: ${{ github.event.inputs.test_seulement == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apercu-pin-test
          path: images/*.png
