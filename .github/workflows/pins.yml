              dernier_par_theme = {}
              for h in historique:
                  t = h.get("theme")
                  if t:
                      dernier_par_theme[t] = h["date"]
              debut = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=14)).isoformat(timespec="minutes")
              recents = {}
              for h in historique:
                  if h.get("theme") and h.get("date", "") >= debut:
                      recents[h["theme"]] = recents.get(h["theme"], 0) + 1
              poids = lambda t: POIDS_THEME.get(t, 1.0) if theme_avec_lien(t) else 0.5
              # Jamais deux épingles du même thème à la suite (12/10/2026) : la pondération sommeil ×3
              # produisait des séries (8 sommeil sur 10 les 08-09/10), et le fil Pinterest pénalise les
              # épingles semblables qui se suivent. Repli sur tous les thèmes s'il n'en reste qu'un.
              dates = [h for h in historique if h.get("theme") and h.get("date")]
              precedent = max(dates, key=lambda h: h["date"])["theme"] if dates else None
              candidats = [t for t in par_theme if t != precedent] or list(par_theme)
              # Exercices illustrés prioritaires si le quota le permet (voir plus haut), sans casser
              # la règle du thème différent.
