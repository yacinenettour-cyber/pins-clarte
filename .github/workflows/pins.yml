              "https://backend.composio.dev/api/v3.1/tools/execute/PINTEREST_CREATE_PIN",
              headers={"x-api-key": CLE, "Content-Type": "application/json"},
              json={"arguments": arguments, "entity_id": entite}, timeout=60,
