              "energie": "énergie et fatigue",
          }


          def texte_alternatif(pin, theme):
              sujet = SUJETS_ALT.get(theme, "bien-être mental")
              accroche = pin.get("texte_image") or pin["titre"]
              if pin.get("points_image"):
                  texte = f"Infographie {sujet} « {accroche} » : " + " ; ".join(pin["points_image"]) + "."
              else:
                  texte = f"Visuel {sujet} avec le message « {accroche} »."
              return texte[:500]


          def attendre_en_ligne(url, essais=18, pause=5):
              for _ in range(essais):
                  try:
                      if requests.get(url, timeout=15).status_code == 200:
                          return True
                  except Exception:
                      pass
                  time.sleep(pause)
              return False


          police_grasse = telecharger_police("Poppins-Bold.ttf",
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          police_normale = telecharger_police("Poppins-Regular.ttf",
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf")

          # Themes sans rapport direct avec le contenu de la formation vendue sur LIEN_PAGE
          # (qui ne couvre que le sommeil et les mecanismes du stress au sens large) :
          # ces pins ne doivent pas rediriger vers la page de capture (pas de lien hors-sujet).
          # energie et fatiguementale ajoutes le 28/09/2026 suite a un pin publie ("Le trou
          # d'energie de 11h...") qui promettait a tort un contenu absent du guide.
          THEMES_SANS_LIEN = {"alimentation", "procrastination", "energie", "fatiguementale"}


          def choisir_pin_equilibre(restants, historique):
              # Rotation entre themes (evite d'enchainer un meme theme), ponderee depuis le
              # 29/09/2026 : un theme qui mene a la page de capture passe deux fois plus
              # souvent qu'un theme sans lien, pour augmenter les clics sortants.
              par_theme = {}
              for p in restants:
                  t = deviner_theme(p["description"])
                  par_theme.setdefault(t, []).append(p)
              dernier_par_theme = {}
              for h in historique:
                  t = h.get("theme")
                  if t:
                      dernier_par_theme[t] = h["date"]
              debut = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=14)).isoformat(timespec="minutes")
              recents = {}
              for h in historique:
                  if h.get("theme") and h.get("date", "") >= debut:
                      recents[h["theme"]] = recents.get(h["theme"], 0) + 1
              poids = lambda t: 0.5 if t in THEMES_SANS_LIEN else 1.0
              theme_choisi = min(par_theme, key=lambda t: (recents.get(t, 0) / poids(t), dernier_par_theme.get(t, "")))
              return par_theme[theme_choisi][0]

          banque = json.load(open("pins.json", encoding="utf-8"))
          faits = {h["titre"] for h in historique}
          restants = [p for p in banque if p["titre"] not in faits]
          if not restants:
              sys.exit("Banque de pins vide : ajoute de nouveaux pins dans pins.json.")
          pin = choisir_pin_equilibre(restants, historique)
          print("Pins restants dans la banque :", len(restants))

          PHRASES_ENREGISTRER = [
              "À garder sous la main pour un soir difficile.",
              "Utile à ressortir quand tu en as besoin.",
              "Pratique pour un soir où le mental s'emballe.",
              "Un repère simple à retrouver facilement.",
              "Ça peut aider de l'avoir sous la main.",
              "Pratique à ressortir les jours plus difficiles.",
          ]

          pin["titre"] = pin["titre"][:100]
          theme = deviner_theme(pin["description"])

          hashtags_m = re.search(r"(\s#\w+(?:\s#\w+)*)\s*$", pin["description"])
          hashtags = hashtags_m.group(1).strip() if hashtags_m else ""
          corps = pin["description"][:hashtags_m.start()] if hashtags_m else pin["description"]

          phrase = random.choice(PHRASES_ENREGISTRER) if random.random() < 0.5 else ""
          # Ne jamais laisser la phrase d'enregistrement pousser dehors l'appel au guide
          # (troncature du corps) ni s'ajouter après lui.
          if phrase and (re.search(r"(?i)guide", corps) or len(corps) + len(phrase) + len(hashtags) + 2 > 495):
              phrase = ""
          queue = " ".join(p for p in [phrase, hashtags] if p)
          budget_corps = 495 - (len(queue) + 1 if queue else 0)
          corps_court = corps[:budget_corps]
          if len(corps) > budget_corps:
              coupe_phrase = max(corps_court.rfind(". "), corps_court.rfind("! "), corps_court.rfind("? "))
              if coupe_phrase >= budget_corps - 150:
                  corps_court = corps_court[:coupe_phrase + 1]
              else:
                  corps_court = corps_court.rsplit(" ", 1)[0].rstrip(" .,;:") + "."
          pin["description"] = corps_court + ((" " + queue) if queue else "")

          os.makedirs("images", exist_ok=True)
          horodatage = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d-%H%M%S")
          nom = "pin-" + horodatage + ".jpg"
          chemin = os.path.join("images", nom)

          if pin.get("image_prete"):
              ajuster_sans_rogner(Image.open(pin["image_prete"]).convert("RGB"), 1000, 1500).save(chemin, "JPEG", quality=93)
              fond_etiquette = "prete:" + pin["image_prete"]
              design = "prete"
              print("Thème détecté :", theme)
              print("Image prête utilisée telle quelle (pas de texte ajouté) :", pin["image_prete"])
          else:
              cle_openai = os.environ.get("OPENAI_API_KEY")
              fond = None
              fond_etiquette = None
              if cle_openai:
                  try:
